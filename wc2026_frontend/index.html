<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIFA World Cup 2026 | Prediction Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════════════════════════ */
:root {
  --bg:       #07101e;
  --surface:  #0d1b30;
  --card:     #132038;
  --card2:    #172543;
  --border:   rgba(100,140,220,0.12);
  --gold:     #f4b942;
  --red:      #ef4444;
  --green:    #22c55e;
  --blue:     #3b82f6;
  --amber:    #f59e0b;
  --purple:   #8b5cf6;
  --text:     #e2eaff;
  --muted:    #6a80a8;
  --faint:    rgba(255,255,255,0.04);
  --radius:   12px;
  --shadow:   0 4px 24px rgba(0,0,0,0.4);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
button { cursor: pointer; border: none; background: none; font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ═══════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════ */
#header {
  position: relative;
  background: linear-gradient(135deg, #060e1c 0%, #0d1a35 40%, #131f3e 70%, #0d1a35 100%);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  padding: 0 24px;
}
#header::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 20% 50%, rgba(244,185,66,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 50%, rgba(59,130,246,0.08) 0%, transparent 60%);
  pointer-events: none;
}
.header-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; gap: 24px;
  padding: 20px 0;
}
.header-brand { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.header-ball { font-size: 40px; animation: spin 12s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.header-title { line-height: 1; }
.header-title h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 22px; font-weight: 700; letter-spacing: 2px;
  color: var(--gold); text-transform: uppercase;
}
.header-title p { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }
.header-stats {
  display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto;
}
.stat-chip {
  background: var(--faint);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; white-space: nowrap;
}
.stat-chip .val { font-weight: 700; font-size: 14px; }
.stat-chip.gold .val { color: var(--gold); }
.stat-chip.green .val { color: var(--green); }
.stat-chip.blue .val { color: var(--blue); }
.stat-chip.amber .val { color: var(--amber); }
.stat-chip.red .val { color: var(--red); }
.stat-chip.clickable {
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.stat-chip.clickable:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(100,140,220,0.35);
  transform: translateY(-1px);
}
.stat-chip.clickable.active-chip {
  border-color: var(--gold);
  background: rgba(244,185,66,0.12);
}
.last-update { font-size: 10px; color: var(--muted); white-space: nowrap; }

/* DATE STRIP */
.date-strip-wrap {
  margin-bottom: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.date-strip-label {
  font-size: 10px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1.5px; font-weight: 600; margin-bottom: 10px;
}
.date-strip {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: thin; scrollbar-color: rgba(100,140,220,0.3) transparent;
}
.date-pill {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border);
  background: var(--faint); flex-shrink: 0;
  transition: all 0.15s; min-width: 60px;
  font-size: 11px;
}
.date-pill:hover { border-color: var(--gold); background: rgba(244,185,66,0.08); }
.date-pill.active { border-color: var(--gold); background: rgba(244,185,66,0.15); }
.date-pill.today-pill { border-color: rgba(59,130,246,0.5); }
.date-pill.today-pill.active { border-color: var(--gold); }
.date-pill .dp-day { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1; }
.date-pill .dp-mon { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
.date-pill .dp-cnt { font-size: 9px; font-weight: 600; margin-top: 3px; color: var(--muted); }
.date-pill.active .dp-day { color: var(--gold); }
.date-pill.has-games .dp-cnt { color: var(--amber); }
.date-pill.has-done .dp-cnt { color: var(--green); }
.date-nav { display: flex; align-items: center; gap: 8px; }
.date-nav-btn {
  padding: 6px 10px; border-radius: 8px;
  background: var(--faint); border: 1px solid var(--border);
  color: var(--muted); font-size: 14px;
  transition: all 0.15s; cursor: pointer;
}
.date-nav-btn:hover { color: var(--text); border-color: var(--gold); }

/* ═══════════════════════════════════════════════════════════
   NAV TABS
═══════════════════════════════════════════════════════════ */
#nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
.nav-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center;
  overflow-x: auto; scrollbar-width: none;
  padding: 0 24px; gap: 2px;
}
.nav-inner::-webkit-scrollbar { display: none; }
.tab {
  padding: 14px 16px;
  font-size: 13px; font-weight: 500;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: all 0.2s; white-space: nowrap;
  border-radius: 0;
}
.tab:hover { color: var(--text); background: var(--faint); }
.tab.active { color: var(--text); border-bottom-color: var(--gold); }
.tab.special { color: var(--text); font-weight: 600; }
.tab.special.active { border-bottom-color: var(--gold); }
.tab-divider {
  width: 1px; height: 24px;
  background: var(--border);
  margin: 0 8px; flex-shrink: 0;
}
.group-tab-label {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  border-radius: 6px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px; font-weight: 700;
  background: rgba(255,255,255,0.05);
  transition: background 0.2s;
}
.tab.active .group-tab-label {
  background: var(--accent, var(--gold));
  color: #07101e;
}

/* ═══════════════════════════════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════════════════════════════ */
#main {
  max-width: 1400px; margin: 0 auto;
  padding: 24px;
}

/* ═══════════════════════════════════════════════════════════
   VIEW PANELS
═══════════════════════════════════════════════════════════ */
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ═══════════════════════════════════════════════════════════
   GROUP HEADER
═══════════════════════════════════════════════════════════ */
.group-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
}
.group-badge {
  font-family: 'Rajdhani', sans-serif;
  font-size: 28px; font-weight: 700;
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
  background: var(--accent);
  color: #07101e;
  flex-shrink: 0;
}
.group-teams { display: flex; flex-wrap: wrap; gap: 8px; }
.group-team-chip {
  background: var(--faint); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 12px;
  font-size: 13px;
}

/* ═══════════════════════════════════════════════════════════
   TWO-COLUMN LAYOUT (STANDINGS + FIXTURES)
═══════════════════════════════════════════════════════════ */
.group-layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 900px) {
  .group-layout { grid-template-columns: 1fr; }
}

/* ═══════════════════════════════════════════════════════════
   STANDINGS TABLE
═══════════════════════════════════════════════════════════ */
.standings-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  position: sticky; top: 58px;
}
.card-title {
  padding: 14px 16px;
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.card-title .accent-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
}
.standings-table { width: 100%; border-collapse: collapse; }
.standings-table th {
  font-size: 10px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1px; padding: 8px 12px; text-align: left; font-weight: 500;
}
.standings-table td {
  padding: 10px 12px; font-size: 13px;
  border-top: 1px solid var(--border);
}
.standings-row.advance td:first-child {
  border-left: 3px solid var(--green);
}
.standings-row.bubble td:first-child {
  border-left: 3px solid var(--amber);
}
.standings-row.out td:first-child {
  border-left: 3px solid transparent;
}
.pos-cell { color: var(--muted); font-size: 12px; font-weight: 600; }
.team-cell { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.team-flag { font-size: 18px; }
.pts-cell { font-weight: 700; color: var(--gold); }
.xgd-cell { color: var(--muted); font-size: 12px; }
.status-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600;
}
.status-advance { background: rgba(34,197,94,0.15); color: var(--green); }
.status-bubble  { background: rgba(245,158,11,0.15); color: var(--amber); }
.status-out     { background: rgba(239,68,68,0.1);  color: var(--muted); }

/* ═══════════════════════════════════════════════════════════
   MATCHDAY SECTION
═══════════════════════════════════════════════════════════ */
.matchday-section { margin-bottom: 16px; }
.matchday-header {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; margin-bottom: 10px;
  cursor: pointer; user-select: none;
}
.matchday-label {
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.matchday-line { flex: 1; height: 1px; background: var(--border); }
.matchday-toggle { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
.matchday-header.collapsed .matchday-toggle { transform: rotate(-90deg); }
.matchday-fixtures { display: flex; flex-direction: column; gap: 10px; }
.matchday-fixtures.hidden { display: none; }

/* ═══════════════════════════════════════════════════════════
   FIXTURE CARD
═══════════════════════════════════════════════════════════ */
.fixture-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.fixture-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent, var(--border));
}
.fixture-card:hover { border-color: rgba(100,140,220,0.3); transform: translateY(-1px); }
.fixture-card.completed { border-color: rgba(34,197,94,0.2); }
.fixture-card.completed::before { background: var(--green); }
.fixture-card.upcoming::before { background: var(--accent, var(--gold)); }

/* Teams Row */
.teams-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.team-block { display: flex; align-items: center; gap: 8px; }
.team-block.away { flex-direction: row-reverse; text-align: right; }
.fixture-flag { font-size: 22px; flex-shrink: 0; }
.fixture-team { font-weight: 600; font-size: 14px; line-height: 1.2; }
.fixture-score-center {
  text-align: center; flex-shrink: 0; min-width: 80px;
}
.score-display {
  font-family: 'Rajdhani', sans-serif;
  font-size: 26px; font-weight: 700; line-height: 1;
  letter-spacing: 2px; color: var(--gold);
}
.score-display.upcoming { font-size: 14px; color: var(--muted); font-family: inherit; font-weight: 400; }
.fixture-meta {
  font-size: 10px; color: var(--muted); margin-top: 3px;
  text-align: center; letter-spacing: 0.5px;
}

/* 1X2 Bar */
.prob-bar-label {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--muted); margin-bottom: 4px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.prob-bar-1x2 {
  height: 8px; border-radius: 4px; overflow: hidden;
  display: flex; margin-bottom: 10px;
}
.bar-home { background: #3b82f6; transition: width 0.6s ease; }
.bar-draw { background: #6b7280; transition: width 0.6s ease; }
.bar-away { background: #8b5cf6; transition: width 0.6s ease; }
.prob-vals {
  display: flex; justify-content: space-between;
  font-size: 11px; font-weight: 600; margin-bottom: 12px;
}
.prob-val-home { color: #3b82f6; }
.prob-val-draw { color: var(--muted); text-align: center; }
.prob-val-away { color: #8b5cf6; text-align: right; }
.winner-tag {
  font-size: 10px; color: var(--gold);
  position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  white-space: nowrap;
}

/* BTTS Row */
.btts-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--faint); border-radius: 8px; padding: 8px 10px;
  margin-bottom: 8px;
}
.btts-label { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; flex-shrink: 0; }
.btts-bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.btts-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.btts-pct { font-size: 11px; font-weight: 700; flex-shrink: 0; min-width: 36px; text-align: right; }
.btts-badge {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px;
  flex-shrink: 0; letter-spacing: 0.5px;
}
.badge-high   { background: rgba(34,197,94,0.2);  color: #4ade80; }
.badge-med    { background: rgba(245,158,11,0.2);  color: var(--amber); }
.badge-no     { background: rgba(239,68,68,0.15);  color: #f87171; }
.badge-pass   { background: rgba(107,114,128,0.2); color: #9ca3af; }

/* Over/Under Row */
.ou-row {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.ou-chip {
  font-size: 10px; color: var(--muted); background: var(--faint);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
}
.ou-chip span { font-weight: 600; color: var(--text); }

/* Result Row (completed) */
.result-row {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.result-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.result-btts-ok   { font-size: 11px; color: var(--green); font-weight: 600; }
.result-btts-no   { font-size: 11px; color: var(--red);   font-weight: 600; }
.result-pred-ok   { font-size: 11px; color: var(--green); font-weight: 600; }
.result-pred-fail { font-size: 11px; color: var(--red);   font-weight: 600; }

/* ═══════════════════════════════════════════════════════════
   TODAY VIEW
═══════════════════════════════════════════════════════════ */
.today-header {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px;
}
.today-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 28px; font-weight: 700; color: var(--gold);
}
.today-date { font-size: 14px; color: var(--muted); }
.today-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 14px;
}
.no-games {
  text-align: center; padding: 60px 20px;
  color: var(--muted); font-size: 15px;
}

/* ═══════════════════════════════════════════════════════════
   BTTS PICKS VIEW
═══════════════════════════════════════════════════════════ */
.picks-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
}
.picks-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 28px; font-weight: 700; color: var(--gold);
}
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  border: 1px solid var(--border);
  color: var(--muted); background: var(--faint);
  transition: all 0.15s;
}
.filter-btn:hover, .filter-btn.active {
  background: var(--gold); color: #07101e; border-color: var(--gold);
}
.picks-table-wrap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
}
.picks-table { width: 100%; border-collapse: collapse; }
.picks-table thead th {
  padding: 11px 14px; font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--border); text-align: left; background: var(--faint);
}
.picks-table tbody td { padding: 12px 14px; border-top: 1px solid var(--border); font-size: 13px; }
.picks-table tbody tr:hover { background: var(--faint); }
.edge-bar {
  display: inline-flex; align-items: center; gap: 6px;
}
.edge-fill {
  height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, #22c55e, #f4b942);
  min-width: 4px;
}
.group-tag {
  display: inline-flex; width: 22px; height: 22px;
  border-radius: 6px; align-items: center; justify-content: center;
  font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 700;
  color: #07101e;
}

/* ═══════════════════════════════════════════════════════════
   STANDINGS VIEW (ALL GROUPS)
═══════════════════════════════════════════════════════════ */
.all-standings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

/* ═══════════════════════════════════════════════════════════
   DRAW VALUE VIEW
═══════════════════════════════════════════════════════════ */
.draw-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}
.draw-card {
  background: var(--card); border: 1px solid var(--border);
  border-left: 3px solid #6b7280;
  border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow);
}
.draw-card-matchup { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.draw-card-meta { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.draw-bar-wrap { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.draw-bar-fill { height: 100%; border-radius: 3px; background: #6b7280; }
.draw-pct-row { display: flex; justify-content: space-between; font-size: 11px; }
.draw-pct-val { font-weight: 700; color: #d1d5db; }
.draw-fair-odds { color: var(--muted); }

/* ═══════════════════════════════════════════════════════════
   ELO REPORT VIEW
═══════════════════════════════════════════════════════════ */
.elo-table-wrap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
}
.elo-table { width: 100%; border-collapse: collapse; }
.elo-table thead th {
  padding: 11px 16px; font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--border); text-align: left; background: var(--faint);
}
.elo-table tbody td { padding: 11px 16px; border-top: 1px solid var(--border); font-size: 13px; }
.elo-table tbody tr:hover { background: var(--faint); }
.elo-delta-bar-wrap { display: flex; align-items: center; gap: 8px; }
.elo-delta-bar {
  height: 6px; border-radius: 3px; min-width: 2px;
  transition: width 0.6s ease;
}
.elo-delta-pos { background: linear-gradient(90deg, #22c55e, #4ade80); }
.elo-delta-neg { background: linear-gradient(90deg, #ef4444, #f87171); }
.elo-delta-val { font-size: 12px; font-weight: 700; min-width: 42px; }
.elo-delta-pos-val { color: #4ade80; }
.elo-delta-neg-val { color: #f87171; }
.elo-delta-zero    { color: var(--muted); }
.elo-info-banner {
  background: var(--faint); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px;
  margin-bottom: 16px; font-size: 13px; color: var(--muted);
  display: flex; gap: 12px; align-items: center;
}
.elo-info-banner strong { color: var(--text); }

/* ═══════════════════════════════════════════════════════════
   SPINNER / LOADING
═══════════════════════════════════════════════════════════ */
#loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; z-index: 999;
}
.spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(244,185,66,0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin2 0.8s linear infinite;
}
@keyframes spin2 { to { transform: rotate(360deg); } }
#loading p { color: var(--muted); font-size: 14px; }

/* ═══════════════════════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: rgba(100,140,220,0.3); border-radius: 3px; }

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════════ */
@media (max-width: 640px) {
  .header-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
  .header-stats { margin-left: 0; }
  #main { padding: 14px; }
  .today-grid { grid-template-columns: 1fr; }
  .teams-row { gap: 6px; }
  .fixture-team { font-size: 12px; }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p>Loading World Cup 2026 predictions…</p>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <!-- HEADER -->
  <header id="header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-ball">⚽</div>
        <div class="header-title">
          <h1>FIFA World Cup 2026</h1>
          <p>Group Stage Prediction Dashboard · Elo→xG→Poisson · Offline Engine</p>
        </div>
      </div>
      <div class="header-stats" id="header-stats"><!-- filled by JS --></div>
      <div class="last-update" id="last-update"></div>
    </div>
  </header>

  <!-- NAV -->
  <nav id="nav">
    <div class="nav-inner" id="nav-tabs"><!-- filled by JS --></div>
  </nav>

  <!-- MAIN -->
  <main id="main"><!-- filled by JS --></main>

</div>

<script>
/* ════════════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════════════ */
const FLAGS = {
  "Mexico":"🇲🇽","Korea Republic":"🇰🇷","Czechia":"🇨🇿","South Africa":"🇿🇦",
  "Canada":"🇨🇦","Switzerland":"🇨🇭","Qatar":"🇶🇦","Bosnia and Herzegovina":"🇧🇦",
  "Brazil":"🇧🇷","Morocco":"🇲🇦","Scotland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Haiti":"🇭🇹",
  "USA":"🇺🇸","Australia":"🇦🇺","Türkiye":"🇹🇷","Paraguay":"🇵🇾",
  "Germany":"🇩🇪","Côte d'Ivoire":"🇨🇮","Ecuador":"🇪🇨","Curaçao":"🇨🇼",
  "Sweden":"🇸🇪","Japan":"🇯🇵","Netherlands":"🇳🇱","Tunisia":"🇹🇳",
  "Belgium":"🇧🇪","IR Iran":"🇮🇷","Egypt":"🇪🇬","New Zealand":"🇳🇿",
  "Spain":"🇪🇸","Saudi Arabia":"🇸🇦","Uruguay":"🇺🇾","Cabo Verde":"🇨🇻",
  "France":"🇫🇷","Senegal":"🇸🇳","Iraq":"🇮🇶","Norway":"🇳🇴",
  "Argentina":"🇦🇷","Algeria":"🇩🇿","Austria":"🇦🇹","Jordan":"🇯🇴",
  "Portugal":"🇵🇹","Colombia":"🇨🇴","Congo DR":"🇨🇩","Uzbekistan":"🇺🇿",
  "England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Croatia":"🇭🇷","Ghana":"🇬🇭","Panama":"🇵🇦",
};

const GCOLORS = {
  A:"#ef4444", B:"#f59e0b", C:"#22c55e", D:"#3b82f6",
  E:"#8b5cf6", F:"#f97316", G:"#14b8a6", H:"#ec4899",
  I:"#06b6d4", J:"#a3e635", K:"#fb923c", L:"#6366f1"
};

const flag = t => FLAGS[t] || "🏳️";
const gc   = g => GCOLORS[g] || "#f4b942";

/* ════════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════════ */
let DATA         = null;
let activeView   = "today";
let bttsFilter   = "all";
let refreshTimer = null;
let selectedDate = new Date().toISOString().slice(0, 10);  // YYYY-MM-DD
let chipFilter   = null;   // null | 'completed' | 'upcoming'

/* ════════════════════════════════════════════════════════
   DATA FETCH
════════════════════════════════════════════════════════ */
async function fetchData() {
  const res  = await fetch("/api/data?" + Date.now());
  DATA       = await res.json();
  render();
  document.getElementById("loading").style.display  = "none";
  document.getElementById("app").style.display      = "";
}

function startAutoRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(async () => {
    try {
      const res = await fetch("/api/data?" + Date.now());
      DATA = await res.json();
      renderMain();
      renderHeader();
    } catch(e) {}
  }, 30000);
}

/* ════════════════════════════════════════════════════════
   RENDER ROOT
════════════════════════════════════════════════════════ */
function render() {
  renderHeader();
  renderNav();
  renderMain();
  startAutoRefresh();
}

/* ════════════════════════════════════════════════════════
   HEADER
════════════════════════════════════════════════════════ */
function renderHeader() {
  const s = DATA.stats;
  const n = DATA.elo_games_in || 0;
  const today = DATA.today;

  // Each chip navigates to a relevant view / filter
  const chips = [
    { cls:"blue",  val:s.total,      label:"Total Fixtures", action:"standings",          tip:"View all standings" },
    { cls:"green", val:s.completed,  label:"Completed",      action:"_filter_completed",  tip:"Browse completed games" },
    { cls:"amber", val:s.upcoming,   label:"Upcoming",       action:"_filter_upcoming",   tip:"Browse upcoming games" },
    { cls:"gold",  val:s.btts_picks, label:"BTTS Picks",    action:"btts",              tip:"Go to BTTS picks" },
    { cls:"blue",  val:n,            label:"Elo results in", action:"elo",               tip:"View Elo report" },
  ];
  if (s.today > 0) chips.push({ cls:"red", val:s.today, label:"Today", action:"today", tip:"Today's fixtures" });

  document.getElementById("header-stats").innerHTML = chips.map(c => {
    const isActive = (activeView === c.action) ||
                     (c.action === "_filter_completed" && chipFilter === "completed") ||
                     (c.action === "_filter_upcoming"  && chipFilter === "upcoming");
    return `<div class="stat-chip ${c.cls} clickable${isActive ? " active-chip" : ""}"
                 title="${c.tip}" data-chip-action="${c.action}">
              <span class="val">${c.val}</span> ${c.label}
            </div>`;
  }).join("");

  document.querySelectorAll("[data-chip-action]").forEach(el => {
    el.addEventListener("click", () => {
      const act = el.dataset.chipAction;
      chipFilter = null;
      if (act === "_filter_completed") {
        chipFilter = "completed";
        selectedDate = null;
        activeView = "today";
      } else if (act === "_filter_upcoming") {
        chipFilter = "upcoming";
        selectedDate = null;
        activeView = "today";
      } else {
        activeView = act;
      }
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      const tab = document.querySelector(`[data-view="${activeView}"]`);
      if (tab) tab.classList.add("active");
      renderHeader();
      renderMain();
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });

  const ts = new Date(DATA.generated_at);
  document.getElementById("last-update").textContent =
    "Updated " + ts.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}

/* ════════════════════════════════════════════════════════
   NAV TABS
════════════════════════════════════════════════════════ */
function renderNav() {
  const groups = Object.keys(DATA.groups);
  const specials = [
    { id:"today",     label:`📅 Today ${DATA.stats.today > 0 ? `(${DATA.stats.today})`:""}` },
    { id:"btts",      label:`🔥 BTTS Picks (${DATA.stats.btts_picks})` },
    { id:"standings", label:`🏆 Standings` },
    { id:"draws",     label:`⚖️ Draw Value` },
  ];

  let html = specials.map(s =>
    `<button class="tab special${activeView===s.id?" active":""}" data-view="${s.id}">${s.label}</button>`
  ).join("");

  html += `<div class="tab-divider"></div>`;

  html += groups.map(g => `
    <button class="tab${activeView==="group-"+g?" active":""}" data-view="group-${g}" style="--accent:${gc(g)}">
      <span class="group-tab-label">${g}</span>
    </button>
  `).join("");

  document.getElementById("nav-tabs").innerHTML = html;

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      activeView = btn.dataset.view;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      renderMain();
      window.scrollTo({top: 0, behavior:"smooth"});
    });
  });
}

/* ════════════════════════════════════════════════════════
   MAIN ROUTER
════════════════════════════════════════════════════════ */
function renderMain() {
  const el = document.getElementById("main");
  if (activeView === "today")         el.innerHTML = renderToday();
  else if (activeView === "btts")     el.innerHTML = renderBTTS();
  else if (activeView === "standings")el.innerHTML = renderAllStandings();
  else if (activeView === "draws")    el.innerHTML = renderDraws();
  else if (activeView === "elo")      el.innerHTML = renderEloReport();
  else if (activeView.startsWith("group-")) {
    const g = activeView.replace("group-", "");
    el.innerHTML = renderGroup(g);
  }
  attachMatchdayToggles();
  attachBTTSFilters();
  attachDatePills();
  animateBars();
}

/* ════════════════════════════════════════════════════════
   TODAY VIEW
════════════════════════════════════════════════════════ */
function renderToday() {
  // Get all unique WC dates that have at least one fixture
  const allDates = [...new Set(DATA.predictions.map(p => p.date))].sort();
  const todayISO = DATA.today;

  // Resolve which date to display
  let dispDate = selectedDate;
  if (!dispDate) {
    // If filtering by completed/upcoming, show all matching games across all dates
    dispDate = null;
  }

  // Build the games list based on filter
  let games;
  if (chipFilter === "completed") {
    games = DATA.predictions.filter(p => p.is_completed);
  } else if (chipFilter === "upcoming") {
    games = DATA.predictions.filter(p => !p.is_completed);
  } else {
    games = DATA.predictions.filter(p => p.date === (dispDate || todayISO));
  }

  // Build date strip pills
  const pills = allDates.map(dt => {
    const d      = new Date(dt + "T12:00:00Z");
    const day    = d.getUTCDate();
    const mon    = d.toLocaleString("en-GB", {month:"short", timeZone:"UTC"});
    const count  = DATA.predictions.filter(p => p.date === dt).length;
    const done   = DATA.predictions.filter(p => p.date === dt && p.is_completed).length;
    const isToday = dt === todayISO;
    const isSel  = dt === (dispDate || todayISO) && !chipFilter;
    const hasDone = done > 0;
    const hasGame = count > 0;
    return `<div class="date-pill${isSel?" active":""}${isToday?" today-pill":""}${hasDone?" has-done":hasGame?" has-games":""}"
                 data-date="${dt}" title="${dt}">
              <div class="dp-day">${day}</div>
              <div class="dp-mon">${mon}</div>
              <div class="dp-cnt">${done}/${count}</div>
            </div>`;
  }).join("");

  // Header text
  let headerText;
  if (chipFilter === "completed") {
    headerText = `All Completed Games (${games.length})`;
  } else if (chipFilter === "upcoming") {
    headerText = `All Upcoming Games (${games.length})`;
  } else {
    const d = new Date((dispDate || todayISO) + "T12:00:00Z");
    headerText = d.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});
  }

  const noGamesMsg = chipFilter
    ? `No ${chipFilter} fixtures found.`
    : `No fixtures on this date.`;

  return `
    <div class="date-strip-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="date-strip-label">Tournament Calendar — select a matchday</div>
        <div class="date-nav">
          <button class="date-nav-btn" id="btn-prev-date">&#8592;</button>
          <button class="date-nav-btn" id="btn-today-date" title="Jump to today">Today</button>
          <button class="date-nav-btn" id="btn-next-date">&#8594;</button>
        </div>
      </div>
      <div class="date-strip" id="date-strip">${pills}</div>
    </div>

    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:18px">
      <div class="today-title">📅 ${headerText}</div>
      ${!chipFilter && games.length > 0 ? `<div class="today-date">${games.length} fixture${games.length>1?"s":""}</div>` : ""}
      ${chipFilter ? `<button onclick="chipFilter=null;selectedDate=DATA.today;renderHeader();renderMain();"
        style="font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:10px;
               padding:3px 10px;background:var(--faint);cursor:pointer">✕ Clear filter</button>` : ""}
    </div>

    ${games.length === 0
      ? `<div class="no-games">${noGamesMsg} ⚽</div>`
      : `<div class="today-grid">${games.map(p => fixtureCard(p, true, gc(p.group))).join("")}</div>`
    }`;
}

function attachDatePills() {
  // Date pill click
  document.querySelectorAll(".date-pill").forEach(pill => {
    pill.addEventListener("click", () => {
      chipFilter    = null;
      selectedDate  = pill.dataset.date;
      renderHeader();
      renderMain();
    });
  });

  // Prev / Next nav buttons
  const allDates = [...new Set(DATA.predictions.map(p => p.date))].sort();
  const curDate  = selectedDate || DATA.today;
  const idx      = allDates.indexOf(curDate);

  const prev = document.getElementById("btn-prev-date");
  const next = document.getElementById("btn-next-date");
  const tod  = document.getElementById("btn-today-date");

  if (prev) prev.onclick = () => {
    if (idx > 0) { chipFilter = null; selectedDate = allDates[idx - 1]; renderHeader(); renderMain(); }
  };
  if (next) next.onclick = () => {
    if (idx < allDates.length - 1) { chipFilter = null; selectedDate = allDates[idx + 1]; renderHeader(); renderMain(); }
  };
  if (tod) tod.onclick = () => {
    chipFilter = null; selectedDate = DATA.today; renderHeader(); renderMain();
  };

  // Scroll active pill into view
  const strip = document.getElementById("date-strip");
  const active = strip && strip.querySelector(".date-pill.active");
  if (active) active.scrollIntoView({inline:"center", behavior:"smooth"});
}

/* ════════════════════════════════════════════════════════
   GROUP VIEW
════════════════════════════════════════════════════════ */
function renderGroup(g) {
  const teams  = DATA.groups[g];
  const stand  = DATA.standings[g];
  const preds  = DATA.predictions.filter(p => p.group === g);
  const color  = gc(g);

  const mds = [1,2,3];
  const fixturesByMD = mds.map(md => ({
    md,
    fixtures: preds.filter(p => p.matchday === md)
  }));

  return `
    <div class="group-header">
      <div class="group-badge" style="background:${color}">GROUP ${g}</div>
      <div class="group-teams">
        ${teams.map(t => `<div class="group-team-chip">${flag(t)} ${t}</div>`).join("")}
      </div>
    </div>
    <div class="group-layout">
      <!-- STANDINGS -->
      <div>
        ${standingsCard(g, stand, color)}
      </div>
      <!-- FIXTURES -->
      <div>
        ${fixturesByMD.map(({md, fixtures}) => `
          <div class="matchday-section">
            <div class="matchday-header" data-md="${g}-${md}">
              <div class="matchday-label">Matchday ${md}</div>
              <div class="matchday-line"></div>
              <div class="matchday-toggle">▾</div>
            </div>
            <div class="matchday-fixtures" id="md-${g}-${md}">
              ${fixtures.map(p => fixtureCard(p, false, color)).join("")}
            </div>
          </div>
        `).join("")}
      </div>
    </div>`;
}

/* ════════════════════════════════════════════════════════
   STANDINGS CARD
════════════════════════════════════════════════════════ */
function standingsCard(g, rows, color) {
  return `
    <div class="standings-card" style="--accent:${color}">
      <div class="card-title"><div class="accent-dot"></div>Projected Standings</div>
      <table class="standings-table">
        <thead>
          <tr>
            <th>#</th><th>Team</th><th>xPts</th><th>xGD</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => {
            const rowClass = r.pos <= 2 ? "advance" : r.pos === 3 ? "bubble" : "out";
            const badge    = r.pos <= 2
              ? `<span class="status-badge status-advance">✓ Advance</span>`
              : r.pos === 3
              ? `<span class="status-badge status-bubble">★ Bubble</span>`
              : `<span class="status-badge status-out">Out</span>`;
            const gdSign   = r.xGD >= 0 ? "+" : "";
            return `
              <tr class="standings-row ${rowClass}">
                <td class="pos-cell">${r.pos}</td>
                <td class="team-cell">
                  <span class="team-flag">${flag(r.team)}</span>
                  <span>${r.team}</span>
                </td>
                <td class="pts-cell">${r.pts.toFixed(1)}</td>
                <td class="xgd-cell">${gdSign}${r.xGD.toFixed(1)}</td>
                <td>${badge}</td>
              </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
}

/* ════════════════════════════════════════════════════════
   FIXTURE CARD
════════════════════════════════════════════════════════ */
function fixtureCard(p, wide=false, accentColor=null) {
  const color     = accentColor || gc(p.group);
  const isDone    = p.is_completed;
  const cls       = isDone ? "completed" : "upcoming";

  // Score / status
  let scoreHtml;
  if (isDone) {
    scoreHtml = `<div class="score-display">${p.actual_home_goals} – ${p.actual_away_goals}</div>
                 <div class="fixture-meta">FINAL · MD${p.matchday}</div>`;
  } else {
    const d = new Date(p.date + "T12:00:00Z");
    const dateStr = d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    scoreHtml = `<div class="score-display upcoming">vs</div>
                 <div class="fixture-meta">${dateStr} · MD${p.matchday}</div>`;
  }

  // BTTS
  const bttsColor  = p.btts_confidence === "HIGH" ? "#22c55e"
                   : p.btts_confidence === "MEDIUM" ? "#f59e0b"
                   : p.btts_confidence === "LOW" ? "#ef4444"
                   : "#6b7280";
  const bttsBadge  = p.btts_confidence === "HIGH"   ? `<span class="btts-badge badge-high">🔥 HIGH</span>`
                   : p.btts_confidence === "MEDIUM"  ? `<span class="btts-badge badge-med">⚡ MED</span>`
                   : p.btts_confidence === "LOW"     ? `<span class="btts-badge badge-no">❄️ NO</span>`
                   : `<span class="btts-badge badge-pass">PASS</span>`;

  // 1X2 predicted winner arrow
  const hw = p.home_win_prob, dp = p.draw_prob, aw = p.away_win_prob;
  let predArrow = "";
  if (p.predicted_result === "HOME") predArrow = `🏠 ${p.home_team}`;
  else if (p.predicted_result === "AWAY") predArrow = `✈️ ${p.away_team}`;
  else predArrow = `⚖️ Draw`;

  // Result row
  let resultHtml = "";
  if (isDone) {
    const bttsTag = p.actual_btts
      ? `<span class="result-btts-ok">BTTS ✓</span>`
      : `<span class="result-btts-no">BTTS ✗</span>`;
    const predTag = p.actual_result === p.predicted_result
      ? `<span class="result-pred-ok">Pred ✅</span>`
      : `<span class="result-pred-fail">Pred ❌ (${p.predicted_result})</span>`;
    resultHtml = `
      <div class="result-row">
        <span class="result-label">Result</span>
        ${bttsTag} ${predTag}
      </div>`;
  }

  // Venue short
  const venue = p.venue.split(",")[0];

  return `
    <div class="fixture-card ${cls}" style="--accent:${color}">
      <div class="teams-row">
        <div class="team-block home">
          <span class="fixture-flag">${flag(p.home_team)}</span>
          <span class="fixture-team">${p.home_team}</span>
        </div>
        <div class="fixture-score-center">${scoreHtml}</div>
        <div class="team-block away">
          <span class="fixture-flag">${flag(p.away_team)}</span>
          <span class="fixture-team">${p.away_team}</span>
        </div>
      </div>

      <!-- 1X2 Bar -->
      <div class="prob-bar-label">
        <span>${p.home_team.split(" ")[0]} ${hw.toFixed(1)}%</span>
        <span>Draw ${dp.toFixed(1)}%</span>
        <span>${p.away_team.split(" ")[0]} ${aw.toFixed(1)}%</span>
      </div>
      <div class="prob-bar-1x2">
        <div class="bar-home" data-w="${hw}" style="width:0%"></div>
        <div class="bar-draw" data-w="${dp}" style="width:0%"></div>
        <div class="bar-away" data-w="${aw}" style="width:0%"></div>
      </div>
      <div class="prob-vals">
        <span class="prob-val-home">${p.home_win_odds}</span>
        <span class="prob-val-draw">→ ${predArrow}</span>
        <span class="prob-val-away">${p.away_win_odds}</span>
      </div>

      <!-- BTTS -->
      <div class="btts-row">
        <span class="btts-label">BTTS</span>
        <div class="btts-bar-wrap">
          <div class="btts-bar-fill" data-btts="${p.btts_prob}"
               style="width:0%;background:${bttsColor}"></div>
        </div>
        <span class="btts-pct" style="color:${bttsColor}">${p.btts_prob.toFixed(1)}%</span>
        ${bttsBadge}
      </div>

      <!-- O/U -->
      <div class="ou-row">
        <div class="ou-chip">O1.5 <span>${p.over_1_5_prob.toFixed(0)}%</span></div>
        <div class="ou-chip">O2.5 <span>${p.over_2_5_prob.toFixed(0)}%</span></div>
        <div class="ou-chip">O3.5 <span>${p.over_3_5_prob.toFixed(0)}%</span></div>
        <div class="ou-chip">xG <span>${p.xg_home.toFixed(2)}-${p.xg_away.toFixed(2)}</span></div>
        <div class="ou-chip">📍 ${venue}</div>
      </div>

      ${resultHtml}
    </div>`;
}

/* ════════════════════════════════════════════════════════
   BTTS PICKS VIEW
════════════════════════════════════════════════════════ */
function renderBTTS() {
  let picks = DATA.btts_picks;
  if (bttsFilter === "high")     picks = picks.filter(p => p.btts_confidence === "HIGH");
  if (bttsFilter === "med")      picks = picks.filter(p => p.btts_confidence === "MEDIUM");
  if (bttsFilter === "upcoming") picks = picks.filter(p => !p.is_completed);
  if (bttsFilter === "done")     picks = picks.filter(p => p.is_completed);

  const rows = picks.map(p => {
    const badgeCls = p.btts_confidence === "HIGH" ? "badge-high" : "badge-med";
    const isDone   = p.is_completed;
    const doneTag  = isDone
      ? (p.actual_btts ? `<span class="result-btts-ok">✓ Hit</span>` : `<span class="result-btts-no">✗ Miss</span>`)
      : `<span style="color:var(--muted);font-size:11px">🔮 Upcoming</span>`;
    const edgeW = Math.min(100, Math.round(p.btts_edge * 3));
    const d = new Date(p.date + "T12:00:00Z");
    const dateStr = d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    return `
      <tr>
        <td><div class="group-tag" style="background:${gc(p.group)}">${p.group}</div></td>
        <td>MD${p.matchday}</td>
        <td>${flag(p.home_team)} ${p.home_team}<br/><small style="color:var(--muted)">${flag(p.away_team)} ${p.away_team}</small></td>
        <td>${dateStr}</td>
        <td style="font-weight:700;color:#22c55e">${p.btts_prob.toFixed(1)}%</td>
        <td>
          <div class="edge-bar">
            <div class="edge-fill" style="width:${edgeW}px"></div>
            <span style="font-size:11px;font-weight:700;color:#22c55e">+${p.btts_edge.toFixed(1)}%</span>
          </div>
        </td>
        <td><span class="btts-badge ${badgeCls}">${p.btts_confidence}</span></td>
        <td>${doneTag}</td>
      </tr>`;
  }).join("");

  return `
    <div class="picks-header">
      <div class="picks-title">🔥 BTTS Picks</div>
      <div class="filter-bar">
        <button class="filter-btn${bttsFilter==="all"?" active":""}" data-btts-filter="all">All (${DATA.btts_picks.length})</button>
        <button class="filter-btn${bttsFilter==="high"?" active":""}" data-btts-filter="high">HIGH only</button>
        <button class="filter-btn${bttsFilter==="med"?" active":""}" data-btts-filter="med">MED only</button>
        <button class="filter-btn${bttsFilter==="upcoming"?" active":""}" data-btts-filter="upcoming">Upcoming</button>
        <button class="filter-btn${bttsFilter==="done"?" active":""}" data-btts-filter="done">Completed</button>
      </div>
    </div>
    <div class="picks-table-wrap">
      <table class="picks-table">
        <thead>
          <tr>
            <th>Grp</th><th>MD</th><th>Matchup</th><th>Date</th>
            <th>BTTS%</th><th>Edge</th><th>Conf</th><th>Result</th>
          </tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--muted)">No picks match this filter</td></tr>`}</tbody>
      </table>
    </div>`;
}

/* ════════════════════════════════════════════════════════
   ALL STANDINGS VIEW
════════════════════════════════════════════════════════ */
function renderAllStandings() {
  const groups = Object.keys(DATA.groups);
  return `
    <div style="margin-bottom:20px">
      <div class="today-title">🏆 Group Standings</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">Projected final standings based on Elo-xG engine · Top 2 guaranteed advance + 8 best 3rd-place teams</div>
    </div>
    <div class="all-standings-grid">
      ${groups.map(g => standingsCard(g, DATA.standings[g], gc(g))).join("")}
    </div>`;
}

/* ════════════════════════════════════════════════════════
   DRAW VALUE VIEW
════════════════════════════════════════════════════════ */
function renderDraws() {
  const picks = DATA.draw_picks;
  return `
    <div style="margin-bottom:20px">
      <div class="today-title">⚖️ Draw Value</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">Upcoming games where Draw probability ≥ 26% · Compare fair odds to your sportsbook</div>
    </div>
    <div class="draw-grid">
      ${picks.map(p => {
        const d = new Date(p.date + "T12:00:00Z");
        const dateStr = d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
        return `
          <div class="draw-card">
            <div class="draw-card-matchup">${flag(p.home_team)} ${p.home_team} vs ${flag(p.away_team)} ${p.away_team}</div>
            <div class="draw-card-meta">Group ${p.group} · MD${p.matchday} · ${dateStr} · ${p.venue.split(",")[0]}</div>
            <div class="draw-bar-wrap">
              <div class="draw-bar-fill" style="width:${p.draw_prob}%"></div>
            </div>
            <div class="draw-pct-row">
              <span class="draw-pct-val">${p.draw_prob.toFixed(1)}%</span>
              <span class="draw-fair-odds">Fair odds: ${p.draw_fair_odds}</span>
            </div>
          </div>`;
      }).join("")}
    </div>`;
}

/* ════════════════════════════════════════════════════════
   INTERACTIONS
════════════════════════════════════════════════════════ */
function attachMatchdayToggles() {
  document.querySelectorAll(".matchday-header").forEach(hdr => {
    hdr.addEventListener("click", () => {
      const md = hdr.dataset.md;
      const el = document.getElementById("md-" + md);
      if (!el) return;
      hdr.classList.toggle("collapsed");
      el.classList.toggle("hidden");
    });
  });
}

function attachBTTSFilters() {
  document.querySelectorAll("[data-btts-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      bttsFilter = btn.dataset.bttsFilter;
      renderMain();
    });
  });
}

function animateBars() {
  requestAnimationFrame(() => {
    document.querySelectorAll(".bar-home").forEach(el => {
      el.style.width = el.dataset.w + "%";
    });
    document.querySelectorAll(".bar-draw").forEach(el => {
      el.style.width = el.dataset.w + "%";
    });
    document.querySelectorAll(".bar-away").forEach(el => {
      el.style.width = el.dataset.w + "%";
    });
    document.querySelectorAll(".btts-bar-fill").forEach(el => {
      el.style.width = el.dataset.btts + "%";
    });
    document.querySelectorAll(".elo-delta-bar").forEach(el => {
      el.style.width = el.dataset.eloW;  // already includes "%" unit
    });
  });
}

/* ════════════════════════════════════════════════════════
   ELO REPORT VIEW
════════════════════════════════════════════════════════ */
function renderEloReport() {
  const deltas = DATA.elo_deltas || [];
  const n      = DATA.elo_games_in || 0;

  // Max effective Elo for bar scaling
  const maxEff = Math.max(1, ...deltas.map(d => d.effective || d.live));

  // Confederation badge colours
  const CONF_COLOR = {
    UEFA:     "#3b82f6",
    CONMEBOL: "#22c55e",
    CAF:      "#f59e0b",
    CONCACAF: "#a78bfa",
    AFC:      "#ef4444",
    OFC:      "#6b7280",
  };

  let rank = 0;
  const rows = deltas.map(d => {
    rank++;
    const eff      = d.effective ?? d.live;
    const effAdj   = d.conf_adj ?? 0;
    const conf     = d.conf ?? "?";
    const confCol  = CONF_COLOR[conf] || "#6b7280";

    // Live delta column
    const isPos  = d.delta > 0;
    const isNeg  = d.delta < 0;
    const liveValCls = isPos ? "elo-delta-pos-val" : isNeg ? "elo-delta-neg-val" : "elo-delta-zero";
    const liveDeltaStr = d.delta === 0 ? "—" : (isPos ? `+${d.delta}` : `${d.delta}`);

    // Conf adjustment column
    const adjCls = effAdj < 0 ? "elo-delta-neg-val" : effAdj > 0 ? "elo-delta-pos-val" : "elo-delta-zero";
    const adjStr = effAdj === 0 ? "—" : (effAdj > 0 ? `+${effAdj}` : `${effAdj}`);

    // Effective Elo bar (proportional to max)
    const barPct = Math.round((eff / maxEff) * 100);

    return `
      <tr>
        <td style="color:var(--muted);font-size:11px;font-weight:600;text-align:center">${rank}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:18px">${flag(d.team)}</span>
            <div>
              <div style="font-weight:600;font-size:13px">${d.team}</div>
              <span style="font-size:9px;font-weight:700;letter-spacing:0.8px;
                           padding:2px 5px;border-radius:4px;
                           background:${confCol}22;color:${confCol}">${conf}</span>
            </div>
          </div>
        </td>
        <td style="color:var(--muted);font-size:12px">${d.base}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-weight:600;font-size:13px">${d.live}</span>
            <span class="elo-delta-val ${liveValCls}" style="font-size:10px">${liveDeltaStr}</span>
          </div>
        </td>
        <td class="${adjCls}" style="font-size:12px;font-weight:600">${adjStr}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-weight:700;font-size:13px;color:var(--gold);min-width:36px">${eff}</span>
            <div style="flex:1;height:5px;background:rgba(255,255,255,0.07);border-radius:3px;min-width:60px">
              <div class="elo-delta-bar elo-delta-pos" data-elo-w="${barPct}%" style="width:0%;height:100%;border-radius:3px;transition:width 0.8s ease"></div>
            </div>
          </div>
        </td>
      </tr>`;
  }).join("");

  return `
    <div style="margin-bottom:16px">
      <div class="today-title">📊 Effective Elo Rankings</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">
        True predicted strength · <strong style="color:var(--text)">${n} WC results applied</strong>
        · 3-layer pipeline: Base → Live (K=40) → Confederation correction
      </div>
    </div>

    <div class="elo-info-banner">
      <span style="font-size:20px">🧠</span>
      <div style="line-height:1.6">
        <strong>3-Layer Elo Pipeline:</strong>
        <span style="color:var(--muted)"> Base</span> (pre-tournament)
        → <span style="color:#22c55e">Live</span> (K=40 updates from WC results)
        → <span style="color:var(--gold)">Effective</span> (confederation bias correction).
        AFC teams historically win only ~28% of cross-confederation WC games vs the expected 50%,
        indicating their Elo is inflated by easier qualifying pools.
        Japan (+25) and Morocco (+20) have per-team overrides for their elite WC track records.
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      ${Object.entries({"UEFA":"#3b82f6","CONMEBOL":"#22c55e","CAF":"#f59e0b","CONCACAF":"#a78bfa","AFC":"#ef4444","OFC":"#6b7280"}).map(([c,col])=>`
        <div style="font-size:10px;font-weight:700;letter-spacing:0.8px;padding:3px 9px;
                    border-radius:5px;background:${col}22;color:${col};border:1px solid ${col}44">${c}</div>
      `).join("")}
    </div>

    <div class="elo-table-wrap">
      <table class="elo-table">
        <thead>
          <tr>
            <th style="text-align:center">#</th>
            <th>Team</th>
            <th>Base</th>
            <th>Live (Δ WC)</th>
            <th>Conf Adj</th>
            <th>Effective ↓</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
