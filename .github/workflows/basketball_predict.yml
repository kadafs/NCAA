name: 🏀 Basketball Daily Predictions

on:
  schedule:
    - cron: '15 5 * * *'  # 05:15 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD)'
        required: false
        default: ''
      force_calibrate:
        description: 'Force run calibration (true/false)'
        required: false
        type: boolean
        default: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          playwright install chromium

      - name: Run Predictions Pipeline
        env:
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
        run: |
          echo "Starting basketball predictions pipeline..."
          
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_FLAG="--date ${{ github.event.inputs.date }}"
            PROBALLERS_DATE="${{ github.event.inputs.date }}"
            echo "Using DATE_FLAG: $DATE_FLAG"
          else
            DATE_FLAG=""
            PROBALLERS_DATE="today"
            echo "No date override. Running for today."
          fi
          
          echo "--- 1. Fetching recent results ---"
          python auto_update_historical.py $DATE_FLAG
          
          echo "--- 1b. Scraping Proballers Advanced Metrics ---"
          python scrape_proballers.py --daily $PROBALLERS_DATE || echo "Proballers scraping finished with warnings."
          
          DAY_OF_MONTH=$(date +%d)
          FORCE_CALIBRATE="${{ github.event.inputs.force_calibrate }}"
          
          if [ "$DAY_OF_MONTH" = "01" ] || [ "$DAY_OF_MONTH" = "15" ] || [ "$FORCE_CALIBRATE" = "true" ]; then
            echo "--- 2. Rebuilding Pace/Eff Pivots (V1) ---"
            python calibrate_from_local.py
            
            echo "--- 2b. Rebuilding Pace/Eff Pivots (V2) ---"
            python calibrate_from_local_v2.py
          else
            echo "--- Skipping Pace/Eff Pivots Rebuild (Runs 1st and 15th of month) ---"
          fi
          
          echo "--- 3. Generating Advanced Metrics (V1) ---"
          python generate_advanced_metrics.py
          
          echo "--- 3b. Generating Advanced Metrics (V2) ---"
          python generate_advanced_metrics_v2.py
          
          echo "--- 4. Running Daily Predictions (V1) ---"
          python run_basketball_daily.py --mode full --refresh $DATE_FLAG
          
          echo "--- 4b. Running Daily Predictions (V2) ---"
          python run_basketball_daily_v2.py --mode full --refresh $DATE_FLAG

      - name: Commit local data changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet && echo "No changes to commit to ncaa-api." || (
            git commit -m "data: generate basketball predictions $(date -u +'%Y-%m-%d')"
            git push
          )

      - name: Checkout Dashboard Repo
        uses: actions/checkout@v4
        with:
          repository: kadafs/sports-analytics
          token: ${{ secrets.GH_PAT }}
          path: sports-analytics

      - name: Sync to Dashboard
        run: |
          echo "Copying predictions to dashboard..."
          mkdir -p sports-analytics/public/data/basketball
          
          # Copy up to 14 latest prediction files
          ls -t data/basketball/universal_predictions_*.json 2>/dev/null | head -14 | xargs -I {} cp {} sports-analytics/public/data/basketball/ || true
          
          # Commit and push
          cd sports-analytics
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/data/basketball/
          git diff --staged --quiet && echo "No changes to commit to dashboard." || (
            git commit -m "data: push daily basketball predictions $(date -u +'%Y-%m-%d')"
            git push
          )
