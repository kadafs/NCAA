name: NBA Data Update

on:
  schedule:
    - cron: '30 */2 * * *' # Every 2 hours, offset by 30 mins from NCAA
  push:
    branches: [ master ]
  workflow_dispatch: # Allows manual trigger

jobs:
  update-nba-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch NBA Data
        timeout-minutes: 10
        run: |
          echo "Fetching NBA Schedule..."
          python -m nba.fetch_nba_schedule || echo "Warning: NBA Schedule fetch failed"
          echo "Fetching NBA Team Stats..."
          python -m nba.fetch_nba_stats || echo "Warning: NBA Team Stats fetch failed"
          echo "Fetching NBA Player Stats..."
          python -m nba.fetch_nba_player_stats || echo "Warning: NBA Player Stats fetch failed"
          echo "Fetching NBA Injuries..."
          python -m nba.fetch_nba_injuries || echo "Warning: NBA Injuries fetch failed"

      - name: Generate NBA Predictions
        timeout-minutes: 5
        run: |
          echo "Generating NBA Predictions (Safe mode)..."
          python run_universal.py --league nba --mode safe
          echo "Generating NBA Predictions (Full mode)..."
          python run_universal.py --league nba --mode full

      - name: Sync to Supabase Store
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        timeout-minutes: 10
        run: |
          echo "Pushing NBA Predictions to Supabase Store..."
          python core/supabase_pusher.py --league nba

      - name: Performance Audit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        timeout-minutes: 5
        run: |
          echo "Running Performance Audit (NBA)..."
          python core/audit_engine.py --days 1 --league nba

      - name: Debug Fetched Data (On Failure or Success)
        if: always()
        run: |
          echo "Listing data directory..."
          ls -R data/ || echo "No data directory found"
          echo "NBA Matchup Files Content Summary:"
          if [ -f "data/nba_matchups.json" ]; then
            head -n 50 "data/nba_matchups.json"
          else
            echo "nba_matchups.json not found"
          fi
