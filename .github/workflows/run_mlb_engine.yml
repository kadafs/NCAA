name: Daily MLB Engine Pipeline

on:
  schedule:
    # Run automatically every day at 13:30 UTC (9:30 AM Eastern Time)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      force_umpire:
        description: 'Force Umpire Engine Update'
        type: boolean
        required: false
        default: false
      target_date:
        description: 'Target Date (YYYY-MM-DD)'
        type: string
        required: false
        default: ''
      run_mlb:
        description: 'Run MLB (Sport 1)'
        type: boolean
        required: false
        default: true
      run_aaa:
        description: 'Run AAA (Sport 11)'
        type: boolean
        required: false
        default: false
      run_aa:
        description: 'Run AA (Sport 12)'
        type: boolean
        required: false
        default: false
      run_lmb:
        description: 'Run LMB (Sport 23)'
        type: boolean
        required: false
        default: true
      run_npb:
        description: 'Run NPB (Japan)'
        type: boolean
        required: false
        default: true
      run_kbo:
        description: 'Run KBO (Korea)'
        type: boolean
        required: false
        default: true

jobs:
  run_mlb_engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ncaa-api
        uses: actions/checkout@v4
        with:
          path: ncaa-api
          # We need a token that can push back to ncaa-api
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout baseball-dashboard
        uses: actions/checkout@v4
        with:
          repository: kadafs/baseball-dashboard
          path: baseball-dashboard
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # cache pip dependencies

      - name: Install Dependencies
        run: |
          cd ncaa-api
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Umpire Engine (Mondays Only or Forced)
        run: |
          cd ncaa-api
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event.inputs.force_umpire }}" = "true" ]; then
            echo "Condition met. Updating umpire stats..."
            python mlb/umpire_engine.py
          else
            echo "Not Monday and not forced. Skipping umpire update."
          fi

      - name: Run MLB Consensus Engine (V4)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_mlb == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd ncaa-api
          python mlb/daily_f5_park_factors.py
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python mlb/consensus_f5_v4.py --date "${{ github.event.inputs.target_date }}"
          else
            python mlb/consensus_f5_v4.py
          fi

      - name: Run AAA Consensus Engine (Optional)
        if: ${{ github.event.inputs.run_aaa == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd ncaa-api
          echo "▶ Running AAA engine (sportId=11)..."
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python mlb/consensus_f5_v4.py --sportId 11 --date "${{ github.event.inputs.target_date }}"
          else
            python mlb/consensus_f5_v4.py --sportId 11
          fi

      - name: Run AA Consensus Engine (Optional)
        if: ${{ github.event.inputs.run_aa == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd ncaa-api
          echo "▶ Running AA engine (sportId=12)..."
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python mlb/consensus_f5_v4.py --sportId 12 --date "${{ github.event.inputs.target_date }}"
          else
            python mlb/consensus_f5_v4.py --sportId 12
          fi

      - name: Run LMB Consensus Engine
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_lmb == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd ncaa-api
          echo "▶ Running LMB engine (sportId=23)..."
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python mlb/consensus_f5_v4.py --sportId 23 --date "${{ github.event.inputs.target_date }}"
          else
            python mlb/consensus_f5_v4.py --sportId 23
          fi

      - name: Run NPB Consensus Engine
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_npb == 'true' }}
        run: |
          cd ncaa-api
          echo "▶ Running NPB engine..."
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python npb/consensus_f5_npb.py --date "${{ github.event.inputs.target_date }}"
          else
            python npb/consensus_f5_npb.py
          fi

      - name: Run KBO Consensus Engine
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_kbo == 'true' }}
        run: |
          cd ncaa-api
          echo "▶ Running KBO engine..."
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python kbo/consensus_f5_kbo.py --date "${{ github.event.inputs.target_date }}"
          else
            python kbo/consensus_f5_kbo.py
          fi

      - name: Push Data to Baseball Dashboard
        run: |
          cd ncaa-api
          python push_to_baseball.py

      - name: Commit Generated Files to ncaa-api
        run: |
          cd ncaa-api
          git add -f mlb/*.md data/baseball/*.json data/umpires.json npb/*.md kbo/*.md
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate daily MLB/MiLB consensus reports"
            git push
          else
            echo "No changes to commit to ncaa-api"
          fi
