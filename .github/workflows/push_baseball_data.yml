name: Push Baseball Data to Dashboard

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'data/baseball/universal_predictions_*.json'

jobs:
  push_data:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the source repository (ncaa-api) into a subfolder
      - name: Checkout ncaa-api
        uses: actions/checkout@v4
        with:
          path: ncaa-api

      # 2. Checkout the destination repository (baseball-dashboard)
      #    Requires a Personal Access Token (PAT) with repo permissions since it's a separate repository
      - name: Checkout baseball-dashboard
        uses: actions/checkout@v4
        with:
          repository: kadafs/baseball-dashboard
          path: baseball-dashboard
          token: ${{ secrets.DASHBOARD_PAT }}

      # 3. Setup Python to run the data pushing script
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Configure Git identity for the commit
      - name: Configure Git User
        run: |
          cd baseball-dashboard
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 5. Run the python script which copies files and executes the git commit/push
      - name: Run push_to_baseball.py
        run: |
          cd ncaa-api
          python push_to_baseball.py
