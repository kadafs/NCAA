name: NBA/NCAA Data Update

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  push:
    branches: [ master ]
  workflow_dispatch: # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch NCAA Stats & BartTorvik
        timeout-minutes: 5
        run: |
          python -m ncaa.fetch_barttorvik
          python -m ncaa.data_fetcher

      - name: Fetch NCAA Injuries
        timeout-minutes: 5
        run: |
          python ncaa/fetch_injuries.py || echo "Warning: NCAA Injuries fetch failed"

      - name: Fetch NBA Schedule & Injuries
        timeout-minutes: 5
        run: |
          python -m nba.fetch_nba_schedule || echo "Warning: NBA Schedule fetch failed"
          python -m nba.fetch_nba_injuries || echo "Warning: NBA Injuries fetch failed"

      - name: Fetch NBA Stats
        timeout-minutes: 5
        run: |
          (python -m nba.fetch_nba_stats || echo "Warning: NBA Team Stats failed")
          (python -m nba.fetch_nba_player_stats || echo "Warning: NBA Player Stats failed")

      - name: Generate Predictions & Push to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        timeout-minutes: 10
        run: |
          echo "Running NCAA Engine (Safe Mode)..."
          python -m ncaa.v1_2.run --mode safe 
          echo "Pushing Universal Predictions to Supabase..."
          python core/supabase_pusher.py
          echo "Running Performance Audit..."
          python core/audit_engine.py --days 1

      - name: Debug Fetched Data (On Failure or Success)
        if: always()
        run: |
          echo "Listing data directory..."
          ls -R data/ || echo "No data directory found"
          echo "Matchup Files Content Summary:"
          cat data/nba_matchups.json 2>/dev/null | head -n 20 || echo "No NBA matchups"
          cat data/ncaa_matchups.json 2>/dev/null | head -n 20 || echo "No NCAA matchups"
          cat data/euro_matchups.json 2>/dev/null | head -n 20 || echo "No EURO matchups"
          cat data/acb_matchups.json 2>/dev/null | head -n 20 || echo "No ACB matchups"

