name: ⚽ Football Daily Predictions

on:
  schedule:
    - cron: '30 4 * * *'   # 04:30 UTC daily — build profiles, then predict at 05:00
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD)'
        required: false
        default: ''
      skip_profiles:
        description: 'Skip corner/booking profile build (saves ~400 API credits)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_calls:
        description: 'Max API calls for profile build'
        required: false
        default: '4000'
        type: string

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build corner & booking profiles (today's leagues only)
        if: ${{ github.event.inputs.skip_profiles != 'true' }}
        env:
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
          else
            TARGET_DATE=$(date -u +'%Y-%m-%d')
          fi
          if [ -n "${{ github.event.inputs.max_calls }}" ]; then
            MAX_CALLS="${{ github.event.inputs.max_calls }}"
          else
            MAX_CALLS="4000"
          fi
          echo "Building corner/booking profiles for leagues active on $TARGET_DATE (Max calls: $MAX_CALLS)..."
          python build_corner_booking_profiles.py --today-only --date "$TARGET_DATE" --season 2026 --max-calls "$MAX_CALLS"
          echo "Profile build complete (stale-only, fresh leagues auto-skipped)."

      - name: Build player props profiles (priority leagues only)
        env:
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
        run: |
          echo "Building player props cache files for all priority leagues..."
          python build_player_props.py
          echo "Player props build complete."

      - name: Run football predictions (full mode)
        env:
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TODAY="${{ github.event.inputs.date }}"
            echo "Using manually provided date: $TODAY"
          else
            TODAY=$(date -u +'%Y-%m-%d')
          fi
          echo "Generating football predictions for $TODAY..."
          python run_football_daily.py --mode full --all-leagues --refresh --date "$TODAY"
          echo "Done."

      - name: Regenerate dates index
        run: |
          python - <<'EOF'
          import json, os, glob
          DATA_DIR = 'data/football'
          files = sorted(glob.glob(os.path.join(DATA_DIR, 'universal_predictions_*.json')), reverse=True)
          result = []
          for f in files:
              date = os.path.basename(f).replace('universal_predictions_', '').replace('.json', '')
              try:
                  payload = json.load(open(f, encoding='utf-8'))
              except Exception:
                  continue
              graded = payload.get('grade_summary') is not None
              scored = sum(1 for p in payload.get('predictions', []) if p.get('actual_result') is not None)
              result.append({'date': date, 'total': payload.get('total_predictions', 0),
                             'graded': graded, 'graded_count': scored, 'grade_summary': payload.get('grade_summary')})
          with open(os.path.join(DATA_DIR, 'dates_index.json'), 'w', encoding='utf-8') as out:
              json.dump({'dates': result}, out, indent=2)
          print(f"dates_index.json updated with {len(result)} date(s)")
          EOF

      - name: Commit local data changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add data/football/
          git diff --staged --quiet && echo "No changes to commit to ncaa-api." || (
            git commit -m "data: generate football predictions $(date -u +'%Y-%m-%d')"
            git push
          )

      - name: Checkout Dashboard Repo
        uses: actions/checkout@v4
        with:
          repository: kadafs/sports-analytics
          token: ${{ secrets.GH_PAT }}
          path: sports-analytics

      - name: Sync to Dashboard
        run: |
          echo "Copying predictions to dashboard..."
          mkdir -p sports-analytics/public/data/football
          
          # Copy up to 14 latest prediction files
          ls -t data/football/universal_predictions_*.json 2>/dev/null | head -14 | xargs -I {} cp {} sports-analytics/public/data/football/ || true
          
          # Copy dates index
          cp data/football/dates_index.json sports-analytics/public/data/football/ || true
          
          # Commit and push
          cd sports-analytics
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/data/football/
          git diff --staged --quiet && echo "No changes to commit to dashboard." || (
            git commit -m "data: push daily football predictions $(date -u +'%Y-%m-%d')"
            git push
          )

      - name: Summary
        if: always()
        run: |
          echo "=== Football prediction files ==="
          ls -lh data/football/ | tail -5
